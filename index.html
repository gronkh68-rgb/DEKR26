<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEKR26 · Beipack-Abholung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=8767536">
</head>
<body>
<div class="app">
  <header class="top">
    <h1>DEKR26 · Beipack-Abholung</h1>
    <span class="tag" id="week"></span>
    <span class="sp"></span>
    <span class="tag" id="mode"></span>
    <button class="btn-sm" id="qrOpen">QR-Codes</button>
    <span class="orb" id="clock" style="color:var(--accent)"></span>
  </header>
  <main class="cols">
    <section class="col">
      <div class="col-title orb"><span>KR / Woche</span><button class="btn-sm" id="planToggle">+ KR</button></div>
      <form class="card plan" id="plan" hidden>
        <div class="kr-in"><span>KR</span><input id="pKr" autocapitalize="characters" placeholder="Nummer" required></div>
        <div class="row">
          <select id="pDay"></select>
          <select id="pHall"></select>
        </div>
        <input id="pPos" placeholder="Positionen (optional): A14 X36 ...">
        <button class="btn-main">Planen</button>
      </form>
      <div class="scroll" id="week-list"></div>
    </section>

    <section class="col map-wrap">
      <div class="map-head">
        <div><h2 id="hallName" style="display:inline"></h2><span class="stat" id="hallStat"></span></div>
        <div class="btns">
          <button id="editToggle">Admin-Modus</button>
          <button class="btn-main" id="hallSwitch"></button>
        </div>
      </div>
      <div class="card editbar" id="editBar" hidden>
        <span>Spaltennummer oder Zeilenbuchstabe ziehen, um sie zu verschieben.</span>
        <label><input type="checkbox" id="follow" checked> Folgende mitziehen</label>
        <button class="btn-sm" id="editExport">Layout exportieren</button>
        <button class="btn-sm btn-warn" id="editReset">Zurücksetzen</button>
      </div>
      <div class="map-box" id="map"></div>
      <div class="card detail" id="detail"></div>
      <div class="legend">
        <span><i style="border-color:var(--orange);background:rgba(255,154,31,.3)"></i>offen</span>
        <span><i style="border-color:var(--green);background:rgba(57,255,20,.3)"></i>bereit / abholbar</span>
        <span><i style="border-color:#16273a;background:#0c1520"></i>kein Beipack</span>
      </div>
    </section>

    <section class="col">
      <div class="col-title orb"><span>Nachrichten</span></div>
      <div class="scroll" id="msgs"></div>
      <form class="card send" id="send">
        <input id="mName" placeholder="Name" maxlength="30">
        <textarea id="mText" placeholder="Nachricht..." maxlength="300" required></textarea>
        <button class="btn-main">Senden</button>
      </form>
    </section>
  </main>
</div>
<div class="modal" id="qrModal" hidden>
  <div class="modal-box">
    <div class="col-title orb"><span>QR-Codes für die Meldeseite</span><button class="btn-sm no-print" id="qrClose">Schließen</button></div>
    <form class="qr-add no-print" id="qrForm">
      <input id="qrName" placeholder="Name, z.B. Platz 3" maxlength="40" required>
      <input id="qrFunc" placeholder="Funktion (optional)" maxlength="40">
      <button class="btn-main">Hinzufügen</button>
      <button type="button" id="qrPrint">Drucken</button>
    </form>
    <div class="empty no-print" id="qrHint"></div>
    <div class="qr-grid" id="qrGrid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/config.js?v=8767536"></script>
<script src="js/halls.js?v=8767536"></script>
<script src="js/core.js?v=8767536"></script>
<script src="js/qrcode.js?v=8767536"></script>
<script src="js/app.js?v=8767536"></script>
</body>
</html>
