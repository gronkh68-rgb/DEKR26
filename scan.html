<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEKR26 · Meldung</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=b2b9235">
</head>
<body>
<div class="mobile">
  <h1>DEKR26 · Fertigmeldung</h1>
  <div class="sub">Beipack abgeholt? KR-Nummer eintragen. <span class="tag" id="who" hidden></span></div>
  <form class="form" id="f" autocomplete="off">
    <label>Name
      <input id="name" readonly tabindex="-1" placeholder="–">
    </label>
    <label>KR-Nummer
      <div class="kr-in"><span>KR</span><input id="kr" autocapitalize="characters" placeholder="Nummer" required></div>
    </label>
    <div class="note" id="note"></div>
    <button class="btn-ok big" id="go">FERTIG</button>
  </form>
  <div class="hist" id="hist"></div>
</div>
<div class="toast" id="toast"></div>
<script src="js/config.js?v=b2b9235"></script>
<script src="js/halls.js?v=b2b9235"></script>
<script src="js/core.js?v=b2b9235"></script>
<script src="js/scan.js?v=b2b9235"></script>
</body>
</html>
