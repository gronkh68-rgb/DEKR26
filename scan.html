<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEKR26 // Meldung</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="mobile">
  <h1>DEKR26 // FERTIGMELDUNG</h1>
  <div class="sub">Beipack abgeholt? KR und Position eintragen.</div>
  <form class="form" id="f" autocomplete="off">
    <label>Name
      <input id="name" maxlength="30" placeholder="Dein Name" required>
    </label>
    <label>KR-Nummer
      <input id="kr" inputmode="numeric" placeholder="z.B. 12345" required>
    </label>
    <label>Position
      <input id="pos" list="poslist" placeholder="z.B. A14" maxlength="8" required style="text-transform:uppercase">
    </label>
    <label>Halle
      <select id="hall"></select>
    </label>
    <div class="note" id="note"></div>
    <button class="btn-ok big" id="go">FERTIG</button>
  </form>
  <datalist id="poslist"></datalist>
  <div class="hist" id="hist"></div>
</div>
<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/halls.js"></script>
<script src="js/core.js"></script>
<script src="js/scan.js"></script>
</body>
</html>
