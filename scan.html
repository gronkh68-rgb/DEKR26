<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://ntfy.sh; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<title>DEUKRO26 · Meldung</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=b14fe45">
</head>
<body>
<div class="mobile">
  <h1>DEUKRO26 · Meldung</h1>
  <div class="sub"><b id="whoName"></b> <span class="tag" id="who" hidden></span></div>
  <div class="note" id="note"></div>
  <div id="inbox"></div>
  <div class="menu" id="menu"></div>

  <section class="sec" id="v-beipack" hidden>
    <div class="form">
      <label>KR-Nummer
        <div class="kr-in"><span>KR</span><input id="kr" list="krlist" autocapitalize="characters" autocomplete="off" placeholder="Nummer"></div>
      </label>
      <div class="card kr-info" id="krInfo" hidden></div>
      <div class="two" id="bBtns">
        <button type="button" class="btn-ok big" id="bOk">Fertig</button>
        <button type="button" class="big-warn" id="bProb">Problem</button>
      </div>
      <button type="button" class="big-gray" id="bNot" hidden>Nicht fertig</button>
      <div class="box" id="probBox" hidden>
        <textarea class="full" id="probText" maxlength="400" placeholder="Problem beschreiben …"></textarea>
        <button type="button" class="btn-main big" id="probSend">Problem senden</button>
      </div>
    </div>
  </section>

  <section class="sec" id="v-podest" hidden>
    <div class="form">
      <label>Podest auswählen</label>
      <div class="chips" id="pdList"></div>
      <label>Oder eigener Text
        <input id="pdText" maxlength="100" placeholder="z.B. Podest 1,2 m mit Geländer">
      </label>
      <label>Für KR
        <div class="kr-in"><span>KR</span><input id="pdKr" list="krlist" autocapitalize="characters" autocomplete="off" placeholder="Nummer"></div>
      </label>
      <label>Oder Position
        <input id="pdPos" maxlength="12" placeholder="z.B. 7 42 Z">
      </label>
      <button type="button" class="btn-main big" id="pdGo">Bestellen</button>
    </div>
    <div id="myOrders" style="margin-top:18px"></div>
  </section>

  <section class="sec" id="v-orders" hidden></section>
  <section class="sec" id="v-problems" hidden></section>
  <section class="sec" id="v-dash" hidden>
    <div class="two" style="margin-bottom:12px">
      <button type="button" class="menu-btn sel" data-dt="new">Meldungen</button>
      <button type="button" class="menu-btn" data-dt="all">Alle KR</button>
    </div>
    <div id="dashNew">
      <div class="box">
        <button type="button" class="big-gray" id="notifBtn">Benachrichtigungen aktivieren</button>
        <div class="empty" id="notifInfo"></div>
        <div class="empty" id="pushInfo"></div>
      </div>
      <div id="dashList"></div>
    </div>
    <div id="dashAll" hidden>
      <input id="allFilter" class="full-in" placeholder="KR oder Position suchen …" autocomplete="off">
      <div id="allList"></div>
    </div>
  </section>

  <datalist id="krlist"></datalist>
  <div class="hist" id="hist"></div>
</div>
<div class="lockcover" id="lockCover" hidden>
  <div class="modal-box" style="max-width:420px">
    <h2>Gerät wartet auf Freigabe</h2>
    <div class="empty">Dieses Gerät ist neu. Ein Admin muss es freigeben. Gerätecode: <b id="lockCode2"></b></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/config.js?v=b14fe45"></script>
<script src="js/halls.js?v=b14fe45"></script>
<script src="js/core.js?v=b14fe45"></script>
<script src="js/scan.js?v=b14fe45"></script>
</body>
</html>
